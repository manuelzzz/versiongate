# Local/self-hosted deployment: one VersionGate instance, one Postgres
# instance. No replicas or clustering — see specs/decisions/database.md.
#
# The Postgres credentials below are development defaults, not meant to
# be used as-is in a real deployment. Override them (e.g. via a .env
# file or a compose override) for anything beyond local use.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: versiongate
      POSTGRES_USER: versiongate
      POSTGRES_PASSWORD: versiongate
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U versiongate"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    environment:
      VERSIONGATE_DATABASE_DSN: postgres://versiongate:versiongate@postgres:5432/versiongate?sslmode=disable
      VERSIONGATE_LISTEN_ADDR: ":8888"
    ports:
      - "8888:8888"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
